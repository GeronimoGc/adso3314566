<DOCTYPE html>
  <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Challenge Responsive</title>
      <style>
        /* * {
          border: 1px solid black;
        } */

        html {
          background-image: url(../../../assets/img/SAO-wallpaper.jpg);
          background-repeat: no-repeat;
          background-size: cover;
          background-position: 0px 0px;
        }
        body {
          width: 70%;
          margin-left: auto;
          margin-right: auto;
          background-color: rgba(0, 0, 0, 0.4);
          border-radius: 16px;
          header {
            display: flex;
            flex-direction: column;
            align-items: center;
            img {
              width: 70%;
            }
            div.personage_1 {
              background-image: url(../../../assets/img/Kazuto.webp);
              background-position: -70px;
            }
            div.personage_2 {
              background-image: url(../../../assets/img/Asuna_with_Yui_Biprobe.webp);
              background-position: -70px;
            }
            div.personage_3 {
              background-image: url(../../../assets/img/Shino.webp);
              background-position: -70px;
            }
            div.personage_4 {
              background-image: url(../../../assets/img/Suguha_cara.webp);
              background-position: -70px;
            }

            div.personage_1,
            div.personage_2,
            div.personage_3,
            div.personage_4 {
              background-size: cover;
            }
            div {
              display: flex;
              flex-direction: row;
              width: 90%;
              margin-top: 1rem;
              margin-left: 1.5rem;
              margin-right: 1.5rem;
              justify-content: center;
              div {
                height: 150px;
                width: 150px;
                span {
                  margin-top: auto;
                  width: 150px;
                  height: 40px;
                  text-align: center;
                  color: white;
                  background-color: rgba(0, 0, 0, 0.4);

                  &:hover {
                    height: 50px;
                    background-color: rgba(0, 0, 0, 0.7);
                    transition:
                      background-color 1s,
                      height 1s;
                  }
                }
              }
            }
          }
        }
      </style>
    </head>

    <body>
      <header>
        <img src="../../../assets/img/SAO-logo.png" alt="" class="logo" />
        <div>
          <div class="personage_1"><span>Kazuto Kirigaya (Kirito)</span></div>
          <div class="personage_2"><span>Asuna Yuuki (Asuna)</span></div>
          <div class="personage_3"><span>Shino Asada (Sinon)</span></div>
          <div class="personage_4"><span>Suguha Kirigaya (Rifa)</span></div>
        </div>
      </header>

      <main></main>
    </body></html
></DOCTYPE>
