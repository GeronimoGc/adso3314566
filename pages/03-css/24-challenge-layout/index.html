<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Punch Man</title>
    <style>
      html {
        background-color: rgb(23, 160, 83);
        body {
          display: flex;
          justify-content: center;
          main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 80%;
            header {
              display: flex;
              justify-content: center;
              div.header {
                background-image: url(../../../assets/img/spriteweb.png);
                background-size: 850px;
                background-position: -12px -425px;
                background-repeat: no-repeat;
                width: 200px;
                height: 200px;
              }
            }
            nav {
              ul {
                display: flex;
                li:hover {
                  background-color: rgba(0, 0, 0, 0.8);
                  border-bottom: yellow 5px solid;
                  transition: 0.5s;
                }
                li {
                  list-style-type: none;
                  margin: 1rem;
                  background-color: rgba(0, 0, 0, 0.4);
                  padding-left: 2.5%;
                  padding-right: 2.5%;
                  padding-top: 1%;
                  padding-bottom: 1%;
                  border-bottom: white 5px solid;
                  a {
                    text-transform: uppercase;
                    color: white;
                    text-decoration: none;
                  }
                }
              }
            }
            section {
              background-color: rgba(0, 0, 0, 0.4);
              display: flex;
              justify-content: center;
              width: fit-content;
              div {
                margin: 0.5rem;
                width: 200px;
                height: 200px;
                border: 1px white solid;
              }
            }
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="header"></div>
      </header>
      <nav>
        <ul>
          <li><a href="#">Inicio</a></li>
          <li><a href="#">Nosotros</a></li>
          <li><a href="#">Portafolio</a></li>
          <li><a href="#">Servicios</a></li>
          <li><a href="#">Contacto</a></li>
        </ul>
      </nav>

      <section>
        <div>
          <span>Spritt 01</span>
        </div>
        <div>
          <span>Spritt 02</span>
        </div>
        <div>
          <span>Spritt 03</span>
        </div>
      </section>
    </main>
  </body>
</html>
