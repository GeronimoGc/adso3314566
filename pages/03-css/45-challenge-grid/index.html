<DOCTYPE html>
  <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Challenge Grid</title>
      <link rel="stylesheet" href="../../../assets/css/style.css" />
      <link rel="stylesheet" href="../../../assets/css/style-css.css" />
      <link
        rel="shortcut icon"
        href="../../../assets/img/logo-html.png"
        type="image/x-icon"
      />
      <style>
        img.img-grid {
          margin: auto;
          width: 90%;
          height: 90%;
          border: 0%;
          border-radius: 0;
        }
        .parent {
          display: grid;
          grid-template-columns: repeat(6, 1fr);
          grid-template-rows: repeat(6, 1fr);
          gap: 8px;
        }

        .div1 {
          grid-column: span 2 / span 2;
          grid-row: span 2 / span 2;
        }

        .div2 {
          grid-column: span 2 / span 2;
          grid-row: span 4 / span 4;
          grid-column-start: 3;
        }

        .div3 {
          grid-column: span 2 / span 2;
          grid-row: span 2 / span 2;
          grid-column-start: 5;
        }

        .div4 {
          grid-column: span 2 / span 2;
          grid-row: span 2 / span 2;
          grid-row-start: 3;
        }

        .div5 {
          grid-column: span 2 / span 2;
          grid-row: span 2 / span 2;
          grid-column-start: 5;
          grid-row-start: 3;
        }

        .div6 {
          grid-column: span 4 / span 4;
          grid-row: span 2 / span 2;
          grid-row-start: 5;
        }

        .div7 {
          grid-column: span 2 / span 2;
          grid-row: span 2 / span 2;
          grid-column-start: 5;
          grid-row-start: 5;
        }
      </style>
    </head>

    <body>
      <div
        id="orb-container"
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: -1;
          pointer-events: none;
        "
      >
        <canvas id="orbCanvas"></canvas>
        <canvas id="" style="position: absolute; top: 0; left: 0"></canvas>
      </div>
      <a class="btn-home" href="../">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
          <path
            d="M41.4 342.6C28.9 330.1 28.9 309.8 41.4 297.3L169.4 169.3C178.6 160.1 192.3 157.4 204.3 162.4C216.3 167.4 224 179.1 224 192L224 256L560 256C586.5 256 608 277.5 608 304L608 336C608 362.5 586.5 384 560 384L224 384L224 448C224 460.9 216.2 472.6 204.2 477.6C192.2 482.6 178.5 479.8 169.3 470.7L41.3 342.7z"
          />
        </svg>
      </a>

      <main>
        <header>
          <h1>Challenge Grid</h1>
          <h2>Irregular Gallery.</h2>
        </header>
        <section>
          <div class="parent">
            <div class="div1">
              <img
                class="img-grid"
                src="../../../assets/img/SAO-wallpaper.jpg"
                alt=""
              />
            </div>
            <div class="div2">
              <img
                class="img-grid"
                src="../../../assets/img/Asuna_with_Yui_Biprobe.webp"
                alt=""
              />
            </div>
            <div class="div3">
              <img
                class="img-grid"
                src="../../../assets/img/Kazuto.webp"
                alt=""
              />
            </div>
            <div class="div4">
              <img
                class="img-grid"
                src="../../../assets/img/megumin2.jpg"
                alt=""
              />
            </div>
            <div class="div5">
              <img
                class="img-grid"
                src="../../../assets/img/Suguha_cara.webp"
                alt=""
              />
            </div>
            <div class="div6">
              <img
                class="img-grid"
                src="../../../assets/img/Shino.webp"
                alt=""
              />
            </div>
            <div class="div7">
              <img
                class="img-grid"
                src="../../../assets/img/megumin.png"
                alt=""
              />
            </div>
          </div>
        </section>
      </main>

      <script src="../../../assets/js/stars.js"></script>
      <script src="../../../assets/js/orbs.js"></script>
    </body></html
></DOCTYPE>
