<DOCTYPE html>
  <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Transformations</title>
      <link rel="stylesheet" href="../../../assets/css/style.css" />
      <link rel="stylesheet" href="../../../assets/css/style-css.css" />
      <link
        rel="shortcut icon"
        href="../../../assets/img/logo-html.png"
        type="image/x-icon"
      />
      <style>
        main section img {
          border-radius: 0;
          border: none;
          display: block;
          margin-block: 1rem;
          margin-inline: auto;
        }
        img.transform1 {
          transform: rotate(90deg);
        }
        img.transform2 {
          transform: scale(0.5);
        }
        img.transform3 {
          transform: TranslateX(-100px);
        }
        img.transform4 {
          transform: skew(30deg);
        }
        img.transform5 {
          transform: rotate(45deg) scale(1.2);
        }
      </style>
    </head>

    <body>
      <div
        id="orb-container"
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: -1;
          pointer-events: none;
        "
      >
        <canvas id="orbCanvas"></canvas>
        <canvas id="" style="position: absolute; top: 0; left: 0"></canvas>
      </div>
      <a class="btn-home" href="../">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
          <path
            d="M41.4 342.6C28.9 330.1 28.9 309.8 41.4 297.3L169.4 169.3C178.6 160.1 192.3 157.4 204.3 162.4C216.3 167.4 224 179.1 224 192L224 256L560 256C586.5 256 608 277.5 608 304L608 336C608 362.5 586.5 384 560 384L224 384L224 448C224 460.9 216.2 472.6 204.2 477.6C192.2 482.6 178.5 479.8 169.3 470.7L41.3 342.7z"
          />
        </svg>
      </a>

      <main>
        <header>
          <h1>Transformations</h1>
          <h2>Rotate, scale, skew, or translate.</h2>
        </header>
        <section>
          <h3>Rotate: 90deg</h3>
          <img
            class="transform1"
            src="../../../assets/img/mario.png"
            width="180px"
          />
          <h3>Scale: 0.5</h3>
          <img
            class="transform2"
            src="../../../assets/img/mario.png"
            width="180px"
          />
          <h3>TranslateX: -100px</h3>
          <img
            class="transform3"
            src="../../../assets/img/mario.png"
            width="180px"
          />
          <h3>Skew: 30deg</h3>
          <img
            class="transform4"
            src="../../../assets/img/mario.png"
            width="180px"
          />
          <h3>Rotate Scale:</h3>
          <img
            class="transform5"
            src="../../../assets/img/mario.png"
            width="180px"
          />
        </section>
      </main>

      <script src="../../../assets/js/stars.js"></script>
      <script src="../../../assets/js/orbs.js"></script>
    </body></html
></DOCTYPE>
