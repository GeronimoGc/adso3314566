<DOCTYPE html>
  <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Animations</title>
      <link rel="stylesheet" href="../../../assets/css/style.css" />
      <link rel="stylesheet" href="../../../assets/css/style-css.css" />
      <link
        rel="shortcut icon"
        href="../../../assets/img/logo-html.png"
        type="image/x-icon"
      />
    <style>
    main section{
            display: flex;
            justify-content: center;
        div.jungle{
            background: url(../../../assets/img/jungle.png) no-repeat center;
            border-radius: 4px;
            margin-block: 2rem;
            position: relative;
            height: 471px;
            width: 380px;
            img{
                border-radius: 0;
                border: none;
                position: absolute;
            }
            img.logo {
                top: 35px;
                left: 30px;
                height: 72px;
                object-fit: contain;
                z-index: 9;
                width: 317px;
                animation: 1s animLogo ease-in infinite;
            }
            img.dk{
                top: 100px;
                left: 120px;
                width: 140px;
                z-index: 8;
                object-fit: contain;
                animation: 2s animDk ease-out infinite;
            }
            div.move {
                position: absolute;
                top: 210px;
                left: 0;
                img.ryno {
                    width: 140px;
                    object-fit: contain;
                    top: 0;
                    animation: 3s animRyno linear infinite;
                }
            }
        }
    }
    @keyframes animLogo{
        0%, 100%{
            transform: scale(1)
        }
        50%{
            transform: scale(1.2)
        }
    }
    @keyframes animDk{
        0% {top: 130px; transform: rotateX(0deg); }
        40% {top: 80px; transform: rotateX(0deg); }
        50% {top: 80px; transform: rotateX(360deg); }
        60% {top: 80px; transform: rotateX(360deg); }
        100% {top: 130px; transform: rotateX(360deg); }
    }
    @keyframes animRyno {
0% {
        transform: translateX(0) scaleX(1) rotate(0deg);
    }
    10% {
        transform: translateX(-10px) scaleX(1) rotate(8deg); 
    }
    20% {
        transform: translateX(180px) scaleX(1) rotate(-15deg); 
    }
    30% {
        transform: translateX(180px) scaleX(1) rotate(0deg); 
    }
    35% {
        transform: translateX(180px) scaleX(-1) rotate(0deg); 
    }
    45% {
        transform: translateX(190px) scaleX(-1) rotate(8deg); 
    }
    60% {
        transform: translateX(0px) scaleX(-1) rotate(-15deg); 
    }
    85% {
        transform: translateX(0px) scaleX(-1) rotate(0deg); 
    }
    95%, 100% {
        transform: translateX(0) scaleX(1) rotate(0deg);
    }
}
    </style>
    </head>

    <body>
      <div
        id="orb-container"
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: -1;
          pointer-events: none;
        "
      >
        <canvas id="orbCanvas"></canvas>
        <canvas id="" style="position: absolute; top: 0; left: 0"></canvas>
      </div>
      <a class="btn-home" href="../">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
          <path
            d="M41.4 342.6C28.9 330.1 28.9 309.8 41.4 297.3L169.4 169.3C178.6 160.1 192.3 157.4 204.3 162.4C216.3 167.4 224 179.1 224 192L224 256L560 256C586.5 256 608 277.5 608 304L608 336C608 362.5 586.5 384 560 384L224 384L224 448C224 460.9 216.2 472.6 204.2 477.6C192.2 482.6 178.5 479.8 169.3 470.7L41.3 342.7z"
          />
        </svg>
      </a>

      <main>
        <header>
          <h1>Animations</h1>
          <h2>Gradual style changes over time.</h2>
        </header>
               <section>
            <div class="jungle">
                <img src="../../../assets/img/logo-dk.png" class="logo">
                <img src="../../../assets/img/dk.png" class="dk">
                <div class="move">
                    <img src="../../../assets/img/ryno.png" class="ryno">
                </div>
            </div>
        </section>
      </main>

      <script src="../../../assets/js/stars.js"></script>
      <script src="../../../assets/js/orbs.js"></script>
    </body></html
></DOCTYPE>
