<DOCTYPE html>
  <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Text Shadow</title>
      <link rel="stylesheet" href="../../../assets/css/style.css" />
      <link rel="stylesheet" href="../../../assets/css/style-css.css" />
      <link
        rel="shortcut icon"
        href="../../../assets/img/logo-html.png"
        type="image/x-icon"
      />
      <style>
        body main section p.txt {
          color: #fff;
          text-align: center;
          font-size: 4rem;
          margin: 0;
        }
        p.txt1 {
          font-size: 3rem;
          text-shadow: 0px 2px 6px #fff;
        }
        p.txt2 {
          text-shadow: -4px -4px 8px #fff;
        }
        p.txt3 {
          text-shadow:
            1px 0px 1px #aaa,
            0px 1px 1px #ccc,
            2px 1px 1px #aaa,
            1px 2px 1px #ccc,
            3px 2px 1px #aaa,
            2px 3px 1px #ccc,
            4px 3px 1px #aaa,
            3px 4px 1px #ccc,
            5px 4px 1px #aaa,
            4px 5px 1px #ccc,
            6px 5px 1px #aaa,
            5px 6px 1px #ccc,
            7px 6px 1px #aaa;
        }
        p.txt4 {
          letter-spacing: 0.8rem;
          text-shadow:
            0px 2px 0px #dfdfdf,
            -2px 5px 0px #b8b8b8,
            -4px 8px 0px #979797,
            -6px 11px 0px #747474,
            -8px 14px 0px #565656,
            -10px 17px 0px #343434,
            -12px 20px 0px #171717,
            -14px 23px 0px #000000;
        }
      </style>
    </head>

    <body>
      <div
        id="orb-container"
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: -1;
          pointer-events: none;
        "
      >
        <canvas id="orbCanvas"></canvas>
        <canvas id="" style="position: absolute; top: 0; left: 0"></canvas>
      </div>
      <a class="btn-home" href="../">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
          <path
            d="M41.4 342.6C28.9 330.1 28.9 309.8 41.4 297.3L169.4 169.3C178.6 160.1 192.3 157.4 204.3 162.4C216.3 167.4 224 179.1 224 192L224 256L560 256C586.5 256 608 277.5 608 304L608 336C608 362.5 586.5 384 560 384L224 384L224 448C224 460.9 216.2 472.6 204.2 477.6C192.2 482.6 178.5 479.8 169.3 470.7L41.3 342.7z"
          />
        </svg>
      </a>

      <main>
        <header>
          <h1>Text Shadow</h1>
          <h2>Adds shadows to text.</h2>
        </header>
        <section>
          <p class="txt txt1">ADSO</p>
          <p class="txt txt2">C.P.I.C</p>
          <p class="txt txt3">SENA</p>
          <p class="txt txt4">Caldas</p>
        </section>
      </main>

      <script src="../../../assets/js/stars.js"></script>
      <script src="../../../assets/js/orbs.js"></script>
    </body>
  </html>
</DOCTYPE>
