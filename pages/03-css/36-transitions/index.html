<DOCTYPE html>
  <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Transitions</title>
      <link rel="stylesheet" href="../../../assets/css/style.css" />
      <link rel="stylesheet" href="../../../assets/css/style-css.css" />
      <link
        rel="shortcut icon"
        href="../../../assets/img/logo-html.png"
        type="image/x-icon"
      />
      <style>
        main section {
          img {
            border: 0;
            border-radius: 0;
            filter: drop-shadow(0 0 12px #fff);
          }
          img.transition01 {
            transition: transform 1s ease-in;
            &:hover {
              transform: scale(1.4);
            }
          }

          img.transition02 {
            transition: transform 1s ease-in;
            &:hover {
              transform: rotate(-180deg);
            }
          }

          img.transition03 {
            transition: transform 1s ease-in;
            &:hover {
              transform: rotateY(180deg);
            }
          }
          img.transition04 {
            transition: transform 1s ease-in;
            &:hover {
              transform: translateX(60px);
            }
          }
          div.box {
            background-color: #fff;
            height: 80px;
            margin-block: 2rem;
            width: 80px;
            transition: width 2s ease-in-out,
                        height 2s 1s ease-in,
                        background-color 4s 1s ease-out;
                        &:hover {
                            background-color: red;
                            width: 300px;
                            height: 160px;
                        }
          }
        }
      </style>
    </head>

    <body>
      <div
        id="orb-container"
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: -1;
          pointer-events: none;
        "
      >
        <canvas id="orbCanvas"></canvas>
        <canvas id="" style="position: absolute; top: 0; left: 0"></canvas>
      </div>
      <a class="btn-home" href="../">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
          <path
            d="M41.4 342.6C28.9 330.1 28.9 309.8 41.4 297.3L169.4 169.3C178.6 160.1 192.3 157.4 204.3 162.4C216.3 167.4 224 179.1 224 192L224 256L560 256C586.5 256 608 277.5 608 304L608 336C608 362.5 586.5 384 560 384L224 384L224 448C224 460.9 216.2 472.6 204.2 477.6C192.2 482.6 178.5 479.8 169.3 470.7L41.3 342.7z"
          />
        </svg>
      </a>

      <main>
        <header>
          <h1>Transitions</h1>
          <h2>Interpolation between two states.</h2>
        </header>
        <section>
          <h3>Scale(1.4):</h3>
          <img src="../../../assets/img/dk.png" alt="DK" class="transition01" />
          <h3>Rotate(-180deg):</h3>
          <img src="../../../assets/img/dk.png" alt="DK" class="transition02" />
          <h3>RotateY(180deg)</h3>
          <img src="../../../assets/img/dk.png" alt="DK" class="transition03" />
          <h3>TranslateX(60px)</h3>
          <img src="../../../assets/img/dk.png" alt="DK" class="transition04" />
          <h3>Multiple:</h3>
          <div class="box"></div>
        </section>
      </main>

      <script src="../../../assets/js/stars.js"></script>
      <script src="../../../assets/js/orbs.js"></script>
    </body></html
></DOCTYPE>
