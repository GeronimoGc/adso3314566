<DOCTYPE html>
  <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Box Shadow</title>
      <link rel="stylesheet" href="../../../assets/css/style.css" />
      <link rel="stylesheet" href="../../../assets/css/style-css.css" />
      <link
        rel="shortcut icon"
        href="../../../assets/img/logo-html.png"
        type="image/x-icon"
      />
      <style>
        div.box {
          background-color: #0006;
          height: 140px;
          margin: 2rem auto;
          width: 200px;
        }
        div.box1 {
          box-shadow: 0 0 12px #fff;
        }
        div.box2 {
          box-shadow: -10px -10px 24px 0 #fff;
        }
        div.box3 {
          box-shadow: 0 0 20px #fff inset;
        }
        div.box4 {
          box-shadow:
            4px 4px 0 4px #cc0,
            8px 8px 0 6px #00c,
            12px 12px 0 8px #c00;
        }
        div.images {
          display: flex;
          justify-content: center;
          margin-block: 2rem;
          gap: 1rem;
        }
        div.images img:first-child {
          box-shadow: 0 0 12px #fff;
        }
        div.images img:last-child {
          filter: drop-shadow(0 0 12px #fff);
        }
      </style>
    </head>

    <body>
      <div
        id="orb-container"
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: -1;
          pointer-events: none;
        "
      >
        <canvas id="orbCanvas"></canvas>
        <canvas id="" style="position: absolute; top: 0; left: 0"></canvas>
      </div>
      <a class="btn-home" href="../">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
          <path
            d="M41.4 342.6C28.9 330.1 28.9 309.8 41.4 297.3L169.4 169.3C178.6 160.1 192.3 157.4 204.3 162.4C216.3 167.4 224 179.1 224 192L224 256L560 256C586.5 256 608 277.5 608 304L608 336C608 362.5 586.5 384 560 384L224 384L224 448C224 460.9 216.2 472.6 204.2 477.6C192.2 482.6 178.5 479.8 169.3 470.7L41.3 342.7z"
          />
        </svg>
      </a>

      <main>
        <header>
          <h1>Box Shadow</h1>
          <h2>Attaches one or more shadows to an element.</h2>
        </header>
        <section>
          <h3>box-shadow: 0 0 12px #fff</h3>
          <div class="box box1"></div>
          <h3>box-shadow: -10px -10px 24px 0 #fff</h3>
          <div class="box box2"></div>
          <h3>box-shadow: 0 0 20px #fff inset</h3>
          <div class="box box3"></div>
          <h3>box-shadow: multiple</h3>
          <div class="box box4"></div>
          <h3>box-shadow: images</h3>
          <div class="images">
            <img src="../../../assets/img/megumin2.jpg" width="180px" />
            <img src="../../../assets/img/megumin.png" width="180px" />
          </div>
        </section>
      </main>

      <script src="../../../assets/js/stars.js"></script>
      <script src="../../../assets/js/orbs.js"></script>
    </body>
  </html>
</DOCTYPE>
