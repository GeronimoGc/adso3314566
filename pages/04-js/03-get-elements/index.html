<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADSO | Get Elements</title>
    <link rel="stylesheet" href="../../../assets/css/style-JS.css" />
    <link
      rel="shortcut icon"
      href="../../../assets/img/logo-js.png"
      type="image/x-icon"
    />
    <style>
        section {
            ul {
                padding: 0;
            }
            ul li,
            figure.animal {
                background-color: #0006;
                border-radius: 2px;
                height: 25px;
                margin: 2px auto;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 25px;
                zoom: 2.5;
            }
        }
    </style>
  </head>

  <body>

    
    <div id="vanta-bg"></div>

    
    <a class="btn-home" href="../" title="Volver al menú">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"
        ></path>
      </svg>
    </a>

    <main>
      <header class="header">
        <h1>Get Elements</h1>
        <div class="card">
          <img src="../../../assets/img/logo-js.png" alt="JavaScript Logo" />
        </div>
        <h4>
          Accede y manipula elementos HTML usando JavaScript.
        </h4>
      </header>

      
      <section class="content-section">
        <h3>Get Element By Id:</h3>
            <h4 id="year"></h4>
            <h3>Get Elements By Tag Name:</h3>
            <ul>
                <li>🍎</li>
                <li>🫐</li>
                <li>🍊</li>
                <li>🍒</li>
            </ul>
            <h4></h4>
            <h3>Get Elements By Class Name</h3>
            <p class="paragraph">Lorem ipsum dolor</p>
            <p class="paragraph">Lorem ipsum dolor</p>
            <p class="paragraph">Lorem ipsum dolor</p>
            <h3>Query Selector & Query Selector All</h3>
            <figure class="animal first">🦊</figure>
            <figure class="animal">🐼</figure>
            <figure class="animal">🐷</figure>
        </section>
      </section>
    </main>

    <script>
      // get element by id 
      const year = document.getElementById("year");
      const ndate = new Date;
      year.textContent = `Present Year : ${ndate.getFullYear()}`; 

      // Get element by tagname 

      const fruits = document.getElementsByTagName(`li`);
      const h4s = document.getElementsByTagName(`h4`);
      h4s[2].textContent = `there are ${fruits.length} fruits  `;
      h4s[2].innerHTML += `<br> last fruit is ${fruits[fruits.length -1].textContent}`;
      h4s[2].innerHTML += `<br> first fruit is ${fruits[0].textContent}`

      // get elements by class name
      const ps = document.getElementsByClassName("paragraph");
      ps[1].textContent = "new text value"
      ps[1].style.backgroundColor = "crimnso";
      ps[1].style.color = "red";
      ps[1].style.padding = "0.4rem";

      // queryselector & queryselectorall
      const first = document.querySelector('figure.first');
      first.style.backgroundColor = 'orange'

      const animal = document.querySelector('figure.animal');
      animal[1].style.backgroundColor = 'blue';
      animal.forEach(Element => {
        Element.style.borderRadius = '50%';
      })
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
      VANTA.NET({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0xffd700,
        backgroundColor: 0x000000
      });
    </script>
  </body>
</html>
