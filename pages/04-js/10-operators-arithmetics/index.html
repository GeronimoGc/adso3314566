<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADSO | Operators Arithmetics</title>
    <link rel="stylesheet" href="../../../assets/css/style-JS.css" />
    <link
      rel="shortcut icon"
      href="../../../assets/img/logo-js.png"
      type="image/x-icon"
    />
    <style>
      table.operators {
        border-collapse: collapse;
        font-size: 0.8rem;
        margin: 40px auto;
        width: 380px;
      }
      table thead th {
        background-color: #f0db4f;
        color: #000c;
      }
      table th,
      table td {
        background-color: #fffc;
        border: 1px solid #333;
        color: #333;
        padding: 6px;
      }
      table thead input {
        border: none;
        border-radius: 20px;
        outline: none;
        padding: 8px;
        width: 120px;
      }
      table tbody td:first-child {
        font-size: 1rem;
        text-align: center;
      }
      table tbody tr:nth-child(even) td {
        background-color: #fff8;
      }
    </style>
  </head>

  <body>
    <div id="vanta-bg"></div>

    <a class="btn-home" href="../" title="Volver al menú">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"
        ></path>
      </svg>
    </a>

    <main>
      <header class="header">
        <h1>Operators Arithmetics</h1>
        <div class="card">
          <img src="../../../assets/img/logo-js.png" alt="JavaScript Logo" />
        </div>
        <h4>Realiza operaciones aritméticas como suma y resta.</h4>
      </header>

      <section class="content-section">
        <table class="operators">
          <thead>
            <tr>
              <th colspan="4">
                <input type="number" placeholder="Y Value" />
              </th>
            </tr>
            <tr>
              <th>Operator</th>
              <th>Example</th>
              <th>Equal</th>
              <th>Result</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>=</td>
              <td>x=y</td>
              <td class="eq"></td>
              <td class="rs"></td>
            </tr>
            <tr>
              <td>+=</td>
              <td>x+=y</td>
              <td class="eq">x=x+y</td>
              <td class="rs"></td>
            </tr>
            <tr>
              <td>-=</td>
              <td>x-=y</td>
              <td class="eq">x=x-y</td>
              <td class="rs"></td>
            </tr>
            <tr>
              <td>*=</td>
              <td>x*=y</td>
              <td class="eq">x=x*y</td>
              <td class="rs"></td>
            </tr>
            <tr>
              <td>/=</td>
              <td>x/=y</td>
              <td class="eq">x=x/y</td>
              <td class="rs"></td>
            </tr>
            <tr>
              <td>%=</td>
              <td>x%=y</td>
              <td class="eq">x=x%y</td>
              <td class="rs"></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script>
      // results
      const eqs = document.querySelectorAll("td.eq");
      const rss = document.querySelectorAll("td.rs");
      const input = document.querySelector("input");
      // Events
      input.oninput = () => {
        if (input.value != "") {
          if (input.value.length < 4) {
            // =
            eqs[0].innerText = "x=" + input.value;
            rss[0].innerText = parseInt(input.value);
            // +=
            rss[1].innerText = 10 + parseInt(input.value);
            // -=
            rss[2].innerText = 10 - parseInt(input.value);
            // *=
            rss[3].innerText = 10 * parseInt(input.value);
            // /=
            rss[4].innerText = 10 / parseInt(input.value);
            // %=
            rss[5].innerText = 10 % parseInt(input.value);
          } else {
            input.value = input.value.slice(0, -1);
          }
        } else {
          eqs[0].innerText = "";
          for (let i = 0; i < rss.length; i++) {
            rss[i].innerText = "";
          }
        }
      };
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
      VANTA.NET({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.0,
        minWidth: 200.0,
        scale: 1.0,
        scaleMobile: 1.0,
        color: 0xffd700,
        backgroundColor: 0x000000,
      });
    </script>
  </body>
</html>
