<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADSO | Variables</title>
    <link rel="stylesheet" href="../../../assets/css/style-JS.css" />
    <link
      rel="shortcut icon"
      href="../../../assets/img/logo-js.png"
      type="image/x-icon"
    />
  </head>

  <body>
    <div id="vanta-bg"></div>

    <a class="btn-home" href="../" title="Volver al menú">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"
        ></path>
      </svg>
    </a>

    <main>
      <header class="header">
        <h1>Variables</h1>
        <div class="card">
          <img src="../../../assets/img/logo-js.png" alt="JavaScript Logo" />
        </div>
        <h4>Almacena y gestiona datos usando variables.</h4>
      </header>

      <section class="content-section">
        <h3>Type String: <small class="type-string"></small></h3>
        <h3>Type Number: <small class="type-number"></small></h3>
        <h3>Type Boolean: <small class="type-boolean"></small></h3>
        <h3>Type Null: <small class="type-null"></small></h3>
        <h3>Type Undefined: <small class="type-undefined"></small></h3>
        <h3>Type Array: <small class="type-array"></small></h3>
        <h3>Type Object: <small class="type-object"></small></h3>
      </section>
    </main>

    <script>
      // Type String
      const tstring = document.querySelector('.type-string');
      const message = 'Hello JS 💛';
      tstring.textContent = `${message} - Length: ${message.length} characters`;

      // type number
      const tnumber = document.querySelector('.type-number');
      const num1 = '45';
      const num2 = 12.4;
      tnumber.textContent = `(45+12.4) => ${parseInt(num1) + num2}`;



      // type boolean

      const tboolean = document.querySelector('.type-boolean');
      const isTrue = (4>8);
      tboolean.textContent = `(4>8) -> ${isTrue}`;


      //type array 
      const tarray = document.querySelector('.type-array');
      const landscapes = ['🎆','💛','😁','🎆'];
      tarray.textContent = `Landscapes -> ${landscapes}`


      //type object
      const tobject = document.querySelector('.type-object');
      const hashira = {
        name: 'kyojuro rengoku',
        type:'🔥',
        age: 20
      }
      toobject.textContent = `${hashira.name} -> ${hashira.type}`;

    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
      VANTA.NET({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.0,
        minWidth: 200.0,
        scale: 1.0,
        scaleMobile: 1.0,
        color: 0xffd700,
        backgroundColor: 0x000000,
      });
    </script>
  </body>
</html>
