<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADSO | Vehicle Object</title>
    <link rel="stylesheet" href="../../../assets/css/style-JS.css" />
    <link
      rel="shortcut icon"
      href="../../../assets/img/logo-js.png"
      type="image/x-icon"
    />

    <style>
      .content-section {
        height: fit-content !important;
        overflow-y: visible !important;
      }
      main {
        max-height: fit-content;
      }
      body {
        overflow-y: scroll;
      }
      div.vehicle {
        &.dark {
          background-color: black;
          header {
            button.mode {
              background: url(../../../assets/img/mode-dark.svg) no-repeat
                center;
              background-position-y: 40%;
              height: 32px;
              width: 89px;
              border: none;
            }
          }
          nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;

            figure.brand {
              display: flex;
              justify-content: center;
              align-items: center;
              height: 54px;
              width: 258px;
              border: 1px solid rgb(65, 68, 79);
              border-radius: 15px;
              background-color: rgb(23, 26, 39);
            }

            button {
              width: 44px;
              height: 44px;
              border: none;
              cursor: pointer;
              transition: transform 0.4s ease-in;
              border-radius: 50px;
              &.prev {
                background: url(../../../assets/img/Overlay+Border+OverlayBlur.svg)
                  no-repeat center;

                &:hover {
                  transform: translateX(-12px);
                }
              }
              &.next {
                background: url(../../../assets/img/Overlay+Border+OverlayBlur-1.svg)
                  no-repeat center;
                &:hover {
                  transform: translateX(12px);
                }
              }
            }
          }
          div {
            align-items: center;
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            figure {
              margin: 0;
              padding: 0;
              display: flex;
              align-items: end;
              justify-content: center;
              padding-bottom: 5px;
              height: 80px;
              width: 120px;
              &.model {
                background: url(../../../assets/img/model.svg) no-repeat center;
              }
              &.reference {
                background: url(../../../assets/img/referrarl.svg) no-repeat
                  center;
              }
              &.color {
                background: url(../../../assets/img/color.svg) no-repeat center;
              }
            }
          }
        }

        margin-left: auto;
        margin-right: auto;
        border-radius: 15px;
        border: 1px solid yellow;
        background-color: white;
        height: 870px;
        width: 412px;
        padding: 1rem;
        header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          figure {
            border: 0px solid white;
            background: url(../../../assets/img/Overlay+Border+Shadow+OverlayBlur.png)
              no-repeat center / cover;
            height: 112px;
            width: 112px;
            margin: 0;
          }
          button.mode {
            border: 0px solid none;
            border-radius: 15px;
            background: url(../../../assets/img/mode-light.svg) no-repeat
              center / cover;
            height: 32px;
            width: 89px;
            margin: 0;
          }
        }
      }
    </style>
  </head>

  <body>
    <div id="vanta-bg"></div>

    <a class="btn-home" href="../" title="Volver al menú">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"
        ></path>
      </svg>
    </a>

    <main>
      <header class="header">
        <h1>Vehicle Object</h1>
        <div class="card">
          <img src="../../../assets/img/logo-js.png" alt="JavaScript Logo" />
        </div>
        <h4>Crea y manipula un objeto vehículo con propiedades.</h4>
      </header>

      <section class="content-section">
        <div class="vehicle">
          <header>
            <figure class="logo"></figure>
            <button class="mode"></button>
          </header>
          <nav>
            <button class="prev"></button>
            <figure class="brand"></figure>
            <button class="next"></button>
          </nav>
          <div>
            <figure class="model"></figure>
            <figure class="reference"></figure>
            <figure class="color"></figure>
          </div>
        </div>
      </section>
    </main>

    <script>
      //Elements
      const vhc = document.querySelector(".vehicle");
      const mode = document.querySelector(".mode");
      const lbrand = document.querySelector(".brand");
      const lmodel = document.querySelector(".model");
      const lrefer = document.querySelector(".reference");
      const lcolor = document.querySelector(".color");

      const lnext = document.querySelector(".next");
      const lprev = document.querySelector(".prev");

      let index = 0;

      const vehicles = {
        attrs: [
          {
            brand: "McLaren",
            refer: "720S",
            model: "2023",
            color: "Blue",
            image: "../../../assets/img/McLaren72052023blue.png",
          },
          {
            brand: "Ferrari",
            refer: "F8 Tributo",
            model: "2023",
            color: "Red",
            image: "../../../assets/img/FerrariF8Tributo2023Red.png",
          },
          {
            brand: "Porsche",
            refer: "911 GT3 RS",
            model: "2024",
            color: "Dark Grey",
            image: "../../../assets/img/Porche911GT3RS2024darkgrey.png",
          },
          {
            brand: "Aston Martin",
            refer: "Valkyrie",
            model: "2023",
            color: "White",
            image: "../../../assets/img/AstonMartinVakyrie2023White.png",
          },
          {
            brand: "Nissan",
            refer: "GT-R",
            model: "2024",
            color: "Orange",
            image: "../../../assets/img/NissanGT-R2024Orange.png",
          },
        ],
      };

      //Detect Dark Mode
      const darkMode = window.matchMedia("(prefers-color-scheme: dark)");
      const updateTheme = (e) => vhc.classList.toggle("dark", e.matches);
      if (darkMode.addEventListener) {
        darkMode.addEventListener("change", updateTheme);
      } else {
        darkMode.addListener(updateTheme);
      }
      updateTheme(darkMode);

      //events
      mode.addEventListener("click", function () {
        vhc.classList.toggle("dark");
      });

      lnext.addEventListener("click", function () {
        index = (index + 1) % vehicles.attrs.length;
        console.log(index);
        car.brand = vehicles.attrs[index].brand;
        car.model = vehicles.attrs[index].model;
        car.refer = vehicles.attrs[index].refer;
        car.color = vehicles.attrs[index].color;
        car.displayData();
      });

lprev.addEventListener("click", function () {
    const totalItems = vehicles.attrs.length;
    index = (index - 1 + totalItems) % totalItems; 
    
    console.log(index);
    
    car.brand = vehicles.attrs[index].brand;
    car.model = vehicles.attrs[index].model;
    car.refer = vehicles.attrs[index].refer;
    car.color = vehicles.attrs[index].color;
    
    car.displayData();
});

      class Vehicle {
        constructor(brand, refer, model, color, image) {
          this.brand = brand;
          this.refer = refer;
          this.model = model;
          this.color = color;
          this.image = image;
          this.displayData();
        }
        displayData() {
          lbrand.textContent = this.brand;
          lmodel.textContent = this.model;
          lrefer.textContent = this.refer;
          lcolor.textContent = this.color;
        }
      }

      car = new Vehicle(
        vehicles.attrs[index].brand,
        vehicles.attrs[index].refer,
        vehicles.attrs[index].model,
        vehicles.attrs[index].color,
        vehicles.attrs[index].image,
      );
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
      VANTA.NET({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.0,
        minWidth: 200.0,
        scale: 1.0,
        scaleMobile: 1.0,
        color: 0xffd700,
        backgroundColor: 0x000000,
      });
    </script>
  </body>
</html>
